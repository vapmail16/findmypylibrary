[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findmypylibrary"
dynamic = ["version"]
description = "Describe a use case in plain English, get a ranked shortlist of real PyPI packages — offline, no API key required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vikkas Pareek" }]
keywords = ["pypi", "package-discovery", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/vapmail16/findmypylibrary"
Source = "https://github.com/vapmail16/findmypylibrary"
Issues = "https://github.com/vapmail16/findmypylibrary/issues"
Changelog = "https://github.com/vapmail16/findmypylibrary/blob/master/CHANGELOG.md"

[project.scripts]
findmypylibrary = "findmypylibrary.cli:run"

[tool.hatch.version]
path = "src/findmypylibrary/__init__.py"

[tool.hatch.build.targets.sdist]
# Source, docs and licence only: the 1.4 MB test corpus and CI config stay in git.
include = ["src", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/findmypylibrary"]

[tool.pytest.ini_options]
addopts = "--cov=findmypylibrary --cov-report=term-missing"
pythonpath = ["tests"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/findmypylibrary"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
