name: Publish to PyPI

# Push a tag like v0.2.0 to release. Uses PyPI Trusted Publishing (OIDC), so no
# API token is stored anywhere. One-time setup on pypi.org: project
# findmypylibrary -> Settings -> Publishing -> add a GitHub publisher with
# owner "vapmail16", repository "findmypylibrary", workflow "publish.yml",
# environment "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release tags must point at a commit on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the full gate suite before releasing
        run: |
          pip install -e ".[dev]" build twine
          pytest --cov-fail-under=90
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy src

      - name: Tag must match the package version
        run: |
          VERSION="$(python -c 'import findmypylibrary; print(findmypylibrary.__version__)')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi

      - name: The snapshot this version downloads must already be published
        # Otherwise `findmypylibrary refresh` would 404 for every new install until the next
        # monthly run. After a SCHEMA_VERSION bump: merge to master, run the "Monthly
        # snapshot refresh" workflow, then push the tag.
        run: |
          ASSET="$(python -c 'from findmypylibrary import fetch; print(fetch.snapshot_asset_name())')"
          TAG="$(python -c 'from findmypylibrary import fetch; print(fetch.SNAPSHOT_TAG)')"
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$ASSET"; then
            echo "Release '$TAG' has no $ASSET. Run the Monthly snapshot refresh workflow first." >&2
            exit 1
          fi

      - name: Build and check distributions
        run: |
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
