name: Monthly snapshot refresh

# Builds the snapshot from live PyPI data and publishes it to the fixed
# "snapshot-latest" release that `findmypylibrary refresh` downloads from.
# Nothing is published unless the crawl and the ranking-quality gate both pass.
#
# Note: GitHub pauses scheduled workflows after 60 days without repository
# activity. If that happens, re-enable it in the Actions tab or run it manually.

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: snapshot-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install findmypylibrary
        run: pip install -e .

      - name: Build snapshot from live PyPI data
        # Exits non-zero (publishing nothing) if under 95% of packages could be fetched.
        run: findmypylibrary refresh --build-locally

      - name: Ranking quality gate
        # Exits non-zero if everyday queries stop returning well-known answers.
        run: findmypylibrary golden

      - name: Publish to the fixed snapshot release
        run: |
          set -euo pipefail
          ASSET="$(python -c 'from findmypylibrary import fetch; print(fetch.snapshot_asset_name())')"
          gzip -9 -c "$XDG_CACHE_HOME/findmypylibrary/snapshot.sqlite" > "$ASSET"
          # No `| head`: under pipefail a closed pipe could fail the step.
          COUNT="$(python -c 'from findmypylibrary import cache; print(cache.snapshot_info()["count"])')"
          NOTES="Prebuilt PyPI snapshot downloaded by 'findmypylibrary refresh'. Rebuilt $(date -u +%Y-%m-%d) with $COUNT packages."
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Snapshot (rolling)" --notes "$NOTES" --latest=false
          fi
          # --clobber replaces the asset in place; downloads can 404 for the few seconds
          # the upload takes (clients report that with a "retry later" message).
          gh release upload "$TAG" "$ASSET" --clobber
          # Notes are updated only after the new asset is really there.
          gh release edit "$TAG" --notes "$NOTES" --latest=false
